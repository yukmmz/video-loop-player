<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LoopPlayer" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.webmanifest" />
<!-- iOS "Add to Home Screen" uses apple-touch-icon (NOT the manifest icons) -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="description" content="Loop local videos one after another, with frame-stepping and speed control. Made for iPad kiosk displays; nothing is uploaded." />
<!-- Link previews (LINE / Slack / X). og:image must be an absolute URL. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Video Loop Player" />
<meta property="og:description" content="Loop local videos one after another, with frame-stepping and speed control. Made for iPad kiosk displays; nothing is uploaded." />
<meta property="og:url" content="https://yukmmz.github.io/video-loop-player/" />
<meta property="og:image" content="https://yukmmz.github.io/video-loop-player/icon-192.png" />
<meta name="twitter:card" content="summary" />
<link rel="icon" type="image/png" href="icon-192.png" />
<title>Video Loop Player</title>
<style>
  :root { --bg:#0b0b0d; --panel:#16161a; --fg:#f2f2f4; --muted:#9a9aa2;
          --accent:#3da9fc; --accent2:#2b6cb0; --line:#2a2a30; --danger:#f87171; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      touch-action:manipulation; }  /* manipulation = no double-tap zoom */
  /* ensure [hidden] wins over .row{display:flex} etc. */
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif; }
  body { display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:12px; padding:10px 14px;
           border-bottom:1px solid var(--line); }
  /* App name + version: the same look in every yukmmz.github.io app. */
  .app-brand { display:flex; align-items:baseline; gap:.45em; white-space:nowrap; }
  .app-title { font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",Roboto,sans-serif;
               font-size:16px; font-weight:700; margin:0; letter-spacing:.02em; line-height:1.2; white-space:nowrap; }
  .app-version { font-size:11px; font-weight:400; opacity:.55; white-space:nowrap; cursor:pointer; }
  .app-version:hover { text-decoration:underline; }
  header .title { color:var(--muted); font-size:13px;
                  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
  header button { white-space:nowrap; flex:0 0 auto; }
  .hdr-lbl { margin-left:.35em; }
  /* phones: Controls shrinks to its icon so ⛶, FB, ? and ⚙ stay on screen;
     on the narrowest phones the app name is cut with "…" rather than pushing ⚙ off */
  @media (max-width:600px) {
    header { gap:4px; padding:8px; }
    .app-brand { min-width:0; }
    .app-title { min-width:0; overflow:hidden; text-overflow:ellipsis; }
    header .hdr-lbl { display:none; }
    header .title { visibility:hidden; }   /* no room; keeps its flex:1 spacing */
    header button:not(.btn-icon) { min-width:44px; padding:10px; }
  }
  .stage { flex:1; display:flex; align-items:center; justify-content:center;
           background:#000; min-height:0; position:relative; }
  video { max-width:100%; max-height:100%; background:#000; }
  .controls { padding:10px 14px; border-top:1px solid var(--line);
              display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  button, a.btn { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           border-radius:10px; padding:12px 16px; font-size:15px; cursor:pointer;
           min-width:48px; min-height:48px;
           user-select:none; -webkit-user-select:none; }
  button:active, a.btn:active { background:#23232a; }
  a.btn { display:inline-flex; align-items:center; text-decoration:none; font-family:inherit; }
  /* header icon buttons (⛶ / ⚙ / sheet ✕): 36x36 in every yukmmz.github.io app */
  .btn-icon { width:36px; height:36px; min-width:36px; min-height:36px; padding:0;
              flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
              color:var(--muted); font-size:1.1rem; line-height:1; }
  /* the settings gear is the one control that must read at a glance */
  #settings-btn { font-size:2.1rem; overflow:visible; }
  button.primary { background:var(--accent2); border-color:var(--accent); }
  button.toggle.on { background:var(--accent2); border-color:var(--accent); }
  button.ghost { background:transparent; }
  label.file { background:var(--accent2); border:1px solid var(--accent);
               border-radius:10px; padding:12px 16px; font-size:15px; cursor:pointer;
               display:inline-flex; align-items:center; min-height:48px; }
  label.file input { display:none; }
  .speed { display:flex; align-items:center; gap:10px; flex:1; min-width:240px; }
  .speed input[type=range] { flex:1; }
  .speedval { font-variant-numeric:tabular-nums; width:56px; text-align:right; }
  .fps { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; }
  .fps input { width:60px; background:var(--panel); color:var(--fg);
               border:1px solid var(--line); border-radius:8px; padding:8px; font-size:14px; }
  .playlist { display:flex; gap:8px; overflow-x:auto; padding:4px 0; }
  .item { flex:0 0 auto; background:var(--panel); border:1px solid var(--line);
          border-radius:10px; padding:10px 12px; font-size:13px; max-width:180px;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .item.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .item.focus { background:var(--accent2); }
  .empty { color:var(--muted); text-align:center; padding:24px; }

  /* collapsed: hide the whole controls panel, keep header (with expand button) */
  body.collapsed .controls { display:none; }

  /* fullscreen mode: video fills the viewport, header+controls hidden */
  body.fs header, body.fs .controls { display:none; }
  body.fs .stage { position:fixed; inset:0; z-index:50; }
  /* filename label in a corner (shown in fullscreen) */
  #fsname { position:fixed; right:14px; bottom:12px; z-index:60; display:none;
            max-width:70vw; padding:6px 10px; border-radius:8px;
            background:rgba(0,0,0,0.45); color:#e8e8ec; font-size:13px;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            pointer-events:none; }
  body.fs #fsname { display:block; }
  /* subtle exit button (shown in fullscreen) */
  #fsexit { position:fixed; top:12px; right:12px; z-index:60; display:none;
            background:rgba(0,0,0,0.45); border-color:rgba(255,255,255,0.25); color:#e8e8ec; }
  body.fs #fsexit { display:flex; }

  /* transient tap-to-reveal control bar (collapsed or fullscreen) */
  /* lift the bar well above the iPad home-indicator / app-switch gesture band */
  #tapbar { position:absolute; left:50%;
            bottom:calc(env(safe-area-inset-bottom, 0px) + 84px);
            transform:translateX(-50%);
            display:flex; gap:12px; z-index:60; opacity:0; pointer-events:none;
            transition:opacity .18s ease; }
  #tapbar.show { opacity:1; pointer-events:auto; }
  #tapbar button { background:rgba(0,0,0,0.6); border-color:rgba(255,255,255,0.3);
                   font-size:17px; padding:12px 22px; min-height:48px; min-width:60px;
                   border-radius:12px; }

  /* small version label (lives in .controls, so it hides when collapsed) */

  /* fixed-width numerics so button labels don't shift as the value changes */
  .num { display:inline-block; text-align:right; font-variant-numeric:tabular-nums;
         min-width:2.4em; }
  /* swipe value: right-aligned (inherits .num) so the fixed-width padding
     sits to the LEFT of the number; width fits the widest value ("99.5") */
  .num-wide { min-width:2.6em; }

  /* QR overlay */
  #qrOverlay { position:fixed; inset:0; z-index:80; display:flex;
               align-items:center; justify-content:center;
               background:rgba(0,0,0,0.72); }
  .qrcard { background:#fff; color:#111; border-radius:16px; padding:20px;
            display:flex; flex-direction:column; align-items:center; gap:14px;
            max-width:92vw; }
  .qrrow { display:flex; flex-direction:row; align-items:flex-start; gap:24px; }
  .qrcol { display:flex; flex-direction:column; align-items:center; gap:10px;
           flex:1 1 0; min-width:0; }
  .qrcard .qrImg { width:min(38vmin,300px); height:auto; image-rendering:pixelated; }
  .qrcard .qrlabel { font-size:15px; font-weight:600; color:#111; }
  .qrcard .qrurl { font-size:13px; color:#333; word-break:break-all; text-align:center; }

  /* settings sheet: centered modal over a dimmed backdrop (same as every
     yukmmz.github.io app; dark here because the app is dark-only) */
  .backdrop { position:fixed; inset:0; z-index:70; background:rgba(0,0,0,0.55); }
  .sheet { position:fixed; z-index:75; top:50%; left:50%; transform:translate(-50%,-50%);
           width:min(440px, calc(100vw - 32px)); max-height:calc(100vh - 48px); overflow-y:auto;
           background:var(--panel); border:1px solid var(--line); border-radius:16px;
           box-shadow:0 6px 22px rgba(0,0,0,0.5); padding:16px; }
  .sheet-head { display:flex; align-items:center; justify-content:space-between;
                gap:8px; margin-bottom:8px; }
  .sheet-title { font-size:1rem; margin:0; }
  .sheet-row { display:flex; align-items:center; justify-content:space-between;
               gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .sheet-label { font-size:.9rem; }
  .sheet select { font:inherit; font-size:15px; color:var(--fg); background:var(--bg);
                  border:1px solid var(--line); border-radius:10px; padding:10px 12px;
                  min-height:48px; max-width:60%; }

  /* changelog overlay: same card as the QR overlay */
  #changelogOverlay { position:fixed; inset:0; z-index:80; display:flex;
                      align-items:center; justify-content:center;
                      background:rgba(0,0,0,0.72); }
  .changelog-card { width:min(520px, calc(100vw - 32px)); max-height:calc(100vh - 48px);
                    align-items:stretch; text-align:left; gap:8px; }
  .changelog-title { font-size:1rem; margin:0; }
  .changelog-list { overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1 1 auto; min-height:0; }
  .changelog-entry + .changelog-entry { border-top:1px solid #ddd; margin-top:8px; padding-top:8px; }
  .changelog-version { font-size:.9rem; margin:0 0 4px; }
  .changelog-entry ul { margin:0; padding-left:1.2em; font-size:.85rem; color:#444; }
  #changelogClose { align-self:center; }

  /* "How to use" window (header ? / ? key): same card as the changelog */
  #helpOverlay { position:fixed; inset:0; z-index:80; display:flex;
                 align-items:center; justify-content:center;
                 background:rgba(0,0,0,0.72); }
  .help-body { font-size:.9rem; line-height:1.6; color:#222; }
  .help-body p { margin:6px 0; }
  .help-body h3 { font-size:.9rem; margin:12px 0 4px; }
  .help-body ul { margin:0; padding-left:1.2em; }
  .help-body ul.keys { list-style:none; padding-left:0; }
  .help-body ul.keys li { margin:3px 0; }
  .help-body .note { font-size:.8rem; color:#555; }
  .help-body kbd { display:inline-block; min-width:1.6em; padding:0 .35em; text-align:center;
                   border:1px solid #bbb; border-bottom-width:2px; border-radius:5px;
                   background:#f4f4f6; font-family:inherit; font-size:.8rem; line-height:1.5; }
  #helpClose { align-self:center; }
  #help-btn { font-size:1.35rem; font-weight:700; }
  /* "FB" packed edge to edge inside the 36x36 key: bold, squeezed sideways, no extra spacing */
  #feedback-btn .fb-mark { display:inline-block; font-size:1.44rem; font-weight:384;
                           font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",Roboto,sans-serif;
                           letter-spacing:-.05em; line-height:1; transform:scaleX(.74); }

  /* feedback window (header FB): same card as the help window */
  #feedbackOverlay { position:fixed; inset:0; z-index:80; display:flex;
                     align-items:center; justify-content:center;
                     background:rgba(0,0,0,0.72); }
  .feedback-lead, .feedback-note { margin:0; font-size:.85rem; color:#555; }
  .feedback-message, .feedback-contact { width:100%; font:inherit; font-size:15px;
                     padding:8px 10px; border:1px solid #bbb; border-radius:10px;
                     background:#fff; color:#111; }
  .feedback-message { resize:vertical; min-height:120px; }
  .feedback-hp { position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
  .feedback-status { margin:0; min-height:1.2em; font-size:.85rem; font-weight:700; }
  .feedback-status.ok { color:#15803d; }
  .feedback-status.err { color:#dc2626; }
  .feedback-actions { display:flex; gap:8px; justify-content:flex-end; }
  #feedbackSend:disabled { opacity:.6; }
  .fs-icon { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2;
             stroke-linecap:round; stroke-linejoin:round; }
  #fullscreen-btn .fs-exit,
  #fullscreen-btn.is-fullscreen .fs-enter { display:none; }
  #fullscreen-btn.is-fullscreen .fs-exit { display:block; }

  /* red dot on ⚙ and on the changelog button until the new version's
     changelog has been opened once */
  #settings-btn, #changelogBtn { position:relative; }
  #settings-btn.has-news::after, #changelogBtn.has-news::after {
    content:''; position:absolute; top:2px; right:2px; width:9px; height:9px;
    border-radius:50%; background:var(--danger); }
</style>
</head>
<body>
<header>
  <div class="app-brand">
    <h1 class="app-title">Video Loop Player</h1>
    <span class="app-version" id="ver"></span>
  </div>
  <span class="title" id="title">no video</span>
  <button id="collapse" class="ghost" data-i18n-title="collapseTitle" data-i18n-aria-label="collapseTitle"
          title="操作パネルを畳む/出す" aria-label="操作パネルを畳む/出す"><span id="collapseArrow">▾</span><span class="hdr-lbl" data-i18n="controlsLabel">操作</span></button>
  <!-- Label and icon follow the state in syncFullscreenBtn(): corners out = expand, corners in = shrink -->
  <button id="fullscreen-btn" class="btn-icon" type="button" title="全画面表示" aria-label="全画面表示">
    <svg class="fs-icon fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
    <svg class="fs-icon fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5"/></svg>
  </button>
  <button id="feedback-btn" class="btn btn-icon" type="button"
          data-i18n-title="c.feedback" data-i18n-aria-label="c.feedback" title="フィードバックを送る" aria-label="フィードバックを送る"><span class="fb-mark" aria-hidden="true">FB</span></button>
  <button id="help-btn" class="btn btn-icon" type="button"
          data-i18n-title="c.help" data-i18n-aria-label="c.help" title="使い方" aria-label="使い方">?</button>
  <button id="settings-btn" class="btn-icon" type="button"
          data-i18n-title="c.settings" data-i18n-aria-label="c.settings"
          title="設定" aria-label="設定" aria-expanded="false">⚙</button>
</header>

<div class="stage" id="stage">
  <video id="video" playsinline webkit-playsinline muted></video>
  <div id="tapbar">
    <button id="tpPrev" data-i18n-title="prevFrame" data-i18n-aria-label="prevFrame" title="前のコマ" aria-label="前のコマ">⏮</button>
    <button id="tpPlay" class="primary" title="再生" aria-label="再生">▶</button>
    <button id="tpNext" data-i18n-title="nextFrame" data-i18n-aria-label="nextFrame" title="次のコマ" aria-label="次のコマ">⏭</button>
  </div>
</div>

<!-- fullscreen overlays -->
<div id="fsname"></div>
<button id="fsexit" class="btn-icon" type="button" data-i18n-title="c.exitFullscreen" data-i18n-aria-label="c.exitFullscreen"
        title="全画面を終了" aria-label="全画面を終了">
  <svg class="fs-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5"/></svg>
</button>

<div class="controls">
  <div class="row">
    <button id="playpause" class="primary">▶ 再生</button>
    <button id="fs" data-i18n="fsEnter">⛶ 全画面</button>
    <button id="restartLoop" class="toggle" data-i18n="loopAll">全動画ループ</button>
    <button id="mute" class="toggle on">🔇 ミュート</button>
    <button id="speedBtn" class="toggle"><span data-i18n="speedBtn">再生速度</span> <span class="num" id="speedNum">1.0</span>x</button>
    <button id="swipeRateBtn" class="toggle"><span data-i18n="swipeBtn">スワイプ</span> <span class="num num-wide" id="swipeNum">2</span>/100px</button>
    <button id="chooseBtn" class="toggle" data-i18n="choose" hidden>動画選択</button>
    <button id="pick" data-i18n="open">開く</button>
    <input id="file" type="file" accept="video/*" multiple hidden />
  </div>

  <div class="row" id="speedPanel" hidden>
    <div class="speed">
      <span data-i18n="speed">速度</span>
      <input id="speed" type="range" min="0.1" max="5" step="0.1" value="1" />
      <span class="speedval" id="speedval">1.0x</span>
    </div>
    <button class="spd" data-v="0.25">0.25x</button>
    <button class="spd" data-v="0.5">0.5x</button>
    <button class="spd" data-v="1">1x</button>
    <button class="spd" data-v="2">2x</button>
    <button class="spd" data-v="5">5x</button>
    <div class="fps">fps <input id="fps" type="number" min="1" max="1000" step="1" value="30" /> <span data-i18n="fpsNote">（コマ送り用）</span></div>
  </div>

  <div class="row" id="swipePanel" hidden>
    <div class="speed">
      <span data-i18n="swipe">スワイプ</span>
      <input id="swipeRate" type="range" min="0.5" max="100" step="0.5" value="2" />
      <span class="speedval" id="swipeRateVal">2.0</span>
    </div>
    <span class="fps" data-i18n="swipeNote">コマ/100px（大きいほど速く進む）</span>
    <button class="swp" data-v="2">2</button>
    <button class="swp" data-v="25">25</button>
    <button class="swp" data-v="50">50</button>
    <button class="swp" data-v="100">100</button>
  </div>

  <div class="playlist" id="playlist" hidden></div>
</div>

<!-- Settings sheet. The common rows (language, share, changelog, other apps)
     are the same in every yukmmz.github.io app. This app has no persistent
     settings, so there are no app rows; it saves nothing, so no "clear data". -->
<div id="sheet-backdrop" class="backdrop" hidden></div>

<section id="settings-panel" class="sheet" hidden data-i18n-aria-label="c.settings" aria-label="設定">
  <div class="sheet-head">
    <h2 class="sheet-title" data-i18n="c.settings">設定</h2>
    <button id="settings-close" class="btn-icon" type="button"
            data-i18n-aria-label="c.close" data-i18n-title="c.close" aria-label="閉じる" title="閉じる">✕</button>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="c.language">言語</span>
    <select id="lang-select" data-i18n-aria-label="c.language" aria-label="言語">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="c.share">共有</span>
    <button id="qrBtn" type="button" data-i18n="c.showQr">QR コードを表示</button>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="c.changelog">更新履歴</span>
    <button id="changelogBtn" type="button" data-i18n="c.showChangelog">表示</button>
  </div>

  <div class="sheet-row">
    <span class="sheet-label" data-i18n="c.otherApps">他のアプリ</span>
    <a id="otherAppsLink" class="btn" href="https://yukmmz.github.io/" target="_blank" rel="noopener"
       data-i18n="c.openPortal">アプリ一覧を開く</a>
  </div>
</section>

<!-- QR overlay: app URL (left) and source repository URL (right) as scannable codes -->
<div id="qrOverlay" hidden>
  <div class="qrcard">
    <div class="qrrow">
      <div class="qrcol">
        <div class="qrlabel">App</div>
        <img class="qrImg" src="qr.svg" alt="QR code for the app URL" />
        <div class="qrurl" id="qrUrl"></div>
      </div>
      <div class="qrcol">
        <div class="qrlabel">Source</div>
        <img class="qrImg" src="src-qr.svg" alt="QR code for the source repository" />
        <div class="qrurl" id="qrSrcUrl"></div>
      </div>
    </div>
    <button id="qrClose" class="primary" data-i18n="c.close">閉じる</button>
  </div>
</div>

<!-- Changelog: newest first, built from CHANGELOG in the script below -->
<div id="changelogOverlay" hidden>
  <div class="qrcard changelog-card" role="dialog" data-i18n-aria-label="c.changelog" aria-label="更新履歴">
    <h2 class="changelog-title" data-i18n="c.changelog">更新履歴</h2>
    <div id="changelogList" class="changelog-list"></div>
    <button id="changelogClose" class="primary" type="button" data-i18n="c.close">閉じる</button>
  </div>
</div>

<!-- "How to use": opened by the header ? button or the ? key; filled from STRINGS.help -->
<div id="helpOverlay" hidden>
  <div class="qrcard changelog-card help-card" role="dialog" data-i18n-aria-label="c.help" aria-label="使い方">

    <div class="changelog-list help-body" data-i18n-html="help"></div>
    <button id="helpClose" class="primary" type="button" data-i18n="c.close">閉じる</button>
  </div>
</div>

<!-- Feedback: the header FB button opens this; sendFeedback() posts to the shared GAS web app -->
<div id="feedbackOverlay" hidden>
  <form id="feedbackForm" class="qrcard changelog-card feedback-card" role="dialog"
        data-i18n-aria-label="c.feedback" aria-label="フィードバックを送る" novalidate>
    <h2 class="changelog-title" data-i18n="c.feedback">フィードバックを送る</h2>
    <p class="feedback-lead" data-i18n="c.feedbackLead"></p>
    <textarea id="feedbackMessage" class="feedback-message" maxlength="2000" rows="6" required
              data-i18n-placeholder="c.feedbackPlaceholder" data-i18n-aria-label="c.feedbackMessage"></textarea>
    <input id="feedbackContact" class="feedback-contact" type="text" maxlength="200" autocomplete="email"
           data-i18n-placeholder="c.feedbackContact" data-i18n-aria-label="c.feedbackContact">
    <!-- honeypot: invisible to people, bots fill it in and are ignored by the server -->
    <input id="feedbackWebsite" class="feedback-hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="feedback-note" data-i18n="c.feedbackNote"></p>
    <p id="feedbackStatus" class="feedback-status" role="status" aria-live="polite"></p>
    <div class="feedback-actions">
      <button id="feedbackClose" type="button" data-i18n="c.close">閉じる</button>
      <button id="feedbackSend" class="primary" type="submit" data-i18n="c.feedbackSend">送信</button>
    </div>
  </form>
</div>

  // Before anything is labelled: sets <html lang> and fills data-i18n markup.

  verEl.textContent = 'v' + APP_VERSION;

  qrSrcUrl.textContent = SRC_URL;
  const fpsInput = $('fps');
  const playlistEl = $('playlist');
  const titleEl = $('title');

  let playlist = [];     // [{name, url}]
  let current = 0;       // index currently loaded
  let focusIndex = null; // when set, repeat just that video

  function revokeAll() { for (const it of playlist) URL.revokeObjectURL(it.url); }

  function renderPlaylist() {
    playlistEl.innerHTML = '';
    if (playlist.length === 0) return;
    playlist.forEach((it, i) => {
      const div = document.createElement('div');
      div.className = 'item' + (i === current ? ' active' : '')
                    + (i === focusIndex ? ' focus' : '');
      div.textContent = (i + 1) + '. ' + it.name;
      div.title = it.name;
      div.addEventListener('click', () => focusOn(i));
      playlistEl.appendChild(div);
    });
  }

  function loadVideo(i, autoplay = true) {
    current = i;
    video.src = playlist[i].url;
    const label = (i + 1) + '/' + playlist.length + '  ' + playlist[i].name;
    titleEl.textContent = label;
    fsName.textContent = label;
    video.load();
    video.playbackRate = parseFloat(speed.value);
    renderPlaylist();
    if (autoplay) play();
  }

  function play() { video.play().then(updatePP).catch(() => updatePP()); }
  function updatePP() {
    playpause.textContent = video.paused ? t('play') : t('pause');
    tpPlay.textContent = video.paused ? '▶' : '⏸';
    // icon-only button: keep its spoken/hover label in step with the icon
    const ppLabel = t(video.paused ? 'playTitle' : 'pauseTitle');
    tpPlay.title = ppLabel;
    tpPlay.setAttribute('aria-label', ppLabel);
  }
  function nextInLoop() { return (current + 1) % playlist.length; }
  function focusOn(i) {
    focusIndex = i;
    loadVideo(i, true);
    // close the chooser panel after a selection
    playlistEl.hidden = true;
    chooseBtn.classList.remove('on');
  }

  fileInput.addEventListener('change', (e) => {
    const files = [...e.target.files].filter(f =>
      f.type.startsWith('video/') || /\.(mp4|mov|m4v|webm)$/i.test(f.name));
    if (files.length === 0) return;
    revokeAll();
    playlist = files.map(f => ({ name: f.name, url: URL.createObjectURL(f) }));
    focusIndex = null; current = 0;
    chooseBtn.hidden = false;   // a chooser is only meaningful once videos exist
    playlistEl.hidden = true;
    chooseBtn.classList.remove('on');
    loadVideo(0, true);  // inside a user gesture -> autoplay allowed
  });

  video.addEventListener('ended', () => {
    if (playlist.length === 0) return;
    if (focusIndex !== null) { video.currentTime = 0; play(); }
    else { loadVideo(nextInLoop(), true); }
  });
  video.addEventListener('play', updatePP);
  video.addEventListener('pause', updatePP);

  playpause.addEventListener('click', () => {
    if (playlist.length === 0) return;
    if (video.paused) play(); else video.pause();
  });

  function stepFrame(dir) {
    if (playlist.length === 0) return;
    video.pause();
    const fps = Math.max(1, parseFloat(fpsInput.value) || 30);
    let t = video.currentTime + dir / fps;
    if (t < 0) t = 0;
    if (isFinite(video.duration)) t = Math.min(t, video.duration - 1e-4);
    video.currentTime = t;
  }

  restartLoop.addEventListener('click', () => {
    if (playlist.length === 0) return;
    focusIndex = null; renderPlaylist();
    if (video.paused) play();
  });

  muteBtn.addEventListener('click', () => {
    video.muted = !video.muted;
    muteBtn.classList.toggle('on', video.muted);
    updateMute();
  });
  function updateMute() { muteBtn.textContent = video.muted ? t('muted') : t('unmuted'); }

  function setSpeed(v) {
    v = Math.min(5, Math.max(0.1, v));
    speed.value = v; speedval.textContent = v.toFixed(1) + 'x';
    speedNum.textContent = v.toFixed(1);   // fixed-width span; "x" is static
    video.playbackRate = v;
  }
  speed.addEventListener('input', () => setSpeed(parseFloat(speed.value)));
  document.querySelectorAll('.spd').forEach(b =>
    b.addEventListener('click', () => setSpeed(parseFloat(b.dataset.v))));

  // "速度" button toggles the speed panel (slider + presets + fps)
  speedBtn.addEventListener('click', () => {
    speedPanel.hidden = !speedPanel.hidden;
    speedBtn.classList.toggle('on', !speedPanel.hidden);
  });

  // swipe-step rate: "frames per 100px" of horizontal swipe (bigger = faster).
  // Stored internally as px-per-frame = 100 / rate, so non-divisors work too
  // (e.g. 3 -> ~33px per frame).
  let swipeStepPx = 50;   // default = 2 frames / 100px
  function setSwipeRate(v) {
    v = Math.min(100, Math.max(0.5, v));
    swipeRate.value = v;
    const txt = Number.isInteger(v) ? String(v) : v.toFixed(1);
    swipeRateVal.textContent = txt;
    swipeNum.textContent = txt;   // fixed-width span; "/100px" is static
    swipeStepPx = 100 / v;
  }
  swipeRate.addEventListener('input', () => setSwipeRate(parseFloat(swipeRate.value)));
  document.querySelectorAll('.swp').forEach(b =>
    b.addEventListener('click', () => setSwipeRate(parseFloat(b.dataset.v))));
  swipeRateBtn.addEventListener('click', () => {
    swipeRatePanel.hidden = !swipeRatePanel.hidden;
    swipeRateBtn.classList.toggle('on', !swipeRatePanel.hidden);
  });
  setSwipeRate(2);
  // "開く" button opens the (hidden) OS file picker
  pickBtn.addEventListener('click', () => fileInput.click());
  // "動画選択" button toggles the list of loaded videos to choose what plays
  chooseBtn.addEventListener('click', () => {
    if (playlist.length === 0) return;
    playlistEl.hidden = !playlistEl.hidden;
    chooseBtn.classList.toggle('on', !playlistEl.hidden);
  });
  // --- settings sheet (⚙): centered modal; closes via ✕, backdrop, or Esc
  function setSettingsOpen(open) {
    settingsPanel.hidden = !open;
    backdrop.hidden = !open;
    settingsBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  settingsBtn.addEventListener('click', () => setSettingsOpen(settingsPanel.hidden));
  settingsClose.addEventListener('click', () => setSettingsOpen(false));
  backdrop.addEventListener('click', () => setSettingsOpen(false));
  langSelect.value = I18N.lang();
  langSelect.addEventListener('change', () => I18N.set(langSelect.value));

  // "Show QR codes" (in settings) shows the app and source QR codes;
  // tap outside the card, Close, or Esc to hide
  qrBtn.addEventListener('click', () => { setSettingsOpen(false); qrOverlay.hidden = false; });
  qrClose.addEventListener('click', () => { qrOverlay.hidden = true; });
  qrOverlay.addEventListener('click', (e) => {
    if (e.target === qrOverlay) qrOverlay.hidden = true;  // click on backdrop
  });

  // --- changelog, and the "new version" dot on ⚙
  function readSeenVersion() {
    try { return localStorage.getItem(SEEN_VERSION_KEY); } catch (e) { return null; }
  }
  function writeSeenVersion() {
    try { localStorage.setItem(SEEN_VERSION_KEY, APP_VERSION); } catch (e) { /* ignore */ }
  }
  // First visit ever: nothing is "new", so record the version quietly. This
  // app kept no storage before 1.9.0, so every visitor without a seen-version
  // counts as a first visitor (no dot).
  function initSeenVersion() {
    if (readSeenVersion() === null) writeSeenVersion();
  }
  function syncNewsMark() {
    const hasNews = readSeenVersion() !== APP_VERSION;
    settingsBtn.classList.toggle('has-news', hasNews);
    changelogBtn.classList.toggle('has-news', hasNews);
  }
  function buildChangelog() {
    changelogList.textContent = '';
    for (const entry of CHANGELOG) {
      const section = document.createElement('section');
      section.className = 'changelog-entry';
      const head = document.createElement('h3');
      head.className = 'changelog-version';
      head.textContent = 'v' + entry.version + ' (' + entry.date + ')';
      section.appendChild(head);
      const list = document.createElement('ul');
      for (const item of entry.items) {
        const li = document.createElement('li');
        li.textContent = item[I18N.lang()] || item.ja;
        list.appendChild(li);
      }
      section.appendChild(list);
      changelogList.appendChild(section);
    }
  }
  function openChangelog() {
    setSettingsOpen(false);
    changelogOverlay.hidden = false;
    changelogList.scrollTop = 0;
    writeSeenVersion();
    syncNewsMark();
  }
  initSeenVersion();
  buildChangelog();
  syncNewsMark();
  verEl.addEventListener('click', openChangelog);
  changelogBtn.addEventListener('click', openChangelog);
  changelogClose.addEventListener('click', () => { changelogOverlay.hidden = true; });
  changelogOverlay.addEventListener('click', (e) => {
    if (e.target === changelogOverlay) changelogOverlay.hidden = true;
  });

  function anyModalOpen() {
    return !settingsPanel.hidden || !qrOverlay.hidden || !changelogOverlay.hidden
        || !helpOverlay.hidden || !feedbackOverlay.hidden;
  }
  function closeModals() {
    setSettingsOpen(false);
    qrOverlay.hidden = true;
    changelogOverlay.hidden = true;
    helpOverlay.hidden = true;
    feedbackOverlay.hidden = true;
  }

  // "How to use" window: header ? button or the ? key; Close, outside tap, Esc
  function openHelp() {
    closeModals();
    helpOverlay.hidden = false;
    helpOverlay.querySelector('.help-body').scrollTop = 0;
  }
  helpBtn.addEventListener('click', openHelp);
  helpClose.addEventListener('click', () => { helpOverlay.hidden = true; });
  helpOverlay.addEventListener('click', (e) => {
    if (e.target === helpOverlay) helpOverlay.hidden = true;
  });

  // Feedback window: header FB button; Close, outside tap, Esc (also from
  // inside the text fields: the global key handler closes any open window first)
  function openFeedback() {
    closeModals();
    feedbackStatus.textContent = '';
    feedbackStatus.className = 'feedback-status';
    feedbackOverlay.hidden = false;
    feedbackMessage.focus();
  }
  function setFeedbackStatus(key, kind) {
    feedbackStatus.textContent = t(key);
    feedbackStatus.className = 'feedback-status' + (kind ? ' ' + kind : '');
  }
  // Post the message to the shared GAS endpoint. Sent as text/plain so the
  // browser makes a "simple" request: GAS cannot answer a CORS preflight.
  function sendFeedback(e) {
    e.preventDefault();
    const message = feedbackMessage.value.trim();
    if (!message) { setFeedbackStatus('c.feedbackEmpty', 'err'); return; }
    feedbackSend.disabled = true;
    setFeedbackStatus('c.feedbackSending', '');
    fetch(FEEDBACK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        app: APP_ID, version: APP_VERSION, lang: I18N.lang(), message: message,
        contact: feedbackContact.value.trim(), website: feedbackWebsite.value
      })
    }).then((res) => res.json()).then((res) => {
      if (!res || !res.ok) throw new Error(res && res.error);
      feedbackMessage.value = '';
      feedbackContact.value = '';
      setFeedbackStatus('c.feedbackThanks', 'ok');
    }).catch(() => {
      setFeedbackStatus('c.feedbackError', 'err');
    }).then(() => {
      feedbackSend.disabled = false;
    });
  }
  feedbackBtn.addEventListener('click', openFeedback);
  feedbackForm.addEventListener('submit', sendFeedback);
  feedbackClose.addEventListener('click', () => { feedbackOverlay.hidden = true; });
  feedbackOverlay.addEventListener('click', (e) => {
    if (e.target === feedbackOverlay) feedbackOverlay.hidden = true;
  });

  // collapse / expand the controls panel
  function updateCollapse() {
    collapseArrow.textContent = document.body.classList.contains('collapsed') ? '▴' : '▾';
  }
  collapseBtn.addEventListener('click', () => {
    const on = document.body.classList.toggle('collapsed');
    updateCollapse();
    if (!on) hideBar();
  });

  // transient tap-to-reveal control bar (only while controls are hidden:
  // i.e. collapsed panel or fullscreen). Tap toggles it; auto-hides after 3s.
  let tapTimer = null;
  function barEligible() {
    return document.body.classList.contains('collapsed')
        || document.body.classList.contains('fs');
  }
  function resetBarTimer() { clearTimeout(tapTimer); tapTimer = setTimeout(hideBar, 3000); }
  function showBar() { tapbar.classList.add('show'); resetBarTimer(); }
  function hideBar() { tapbar.classList.remove('show'); clearTimeout(tapTimer); }
  let swipeConsumed = false;   // set when a swipe occurred, to suppress the tap
  stage.addEventListener('click', (e) => {
    if (e.target.closest('#tapbar')) return;   // button taps handled below
    if (swipeConsumed) { swipeConsumed = false; return; }  // it was a swipe
    if (!barEligible()) return;
    if (tapbar.classList.contains('show')) hideBar(); else showBar();
  });

  // swipe left/right over the stage to step frames (only while controls are
  // hidden: collapsed or fullscreen). Each swipeStepPx of travel = one frame
  // (set via the "スワイプ" rate control), ratcheted: reversing mid-gesture
  // steps back, so the net follows the finger.
  const swipe = { active: false, lastX: 0, startX: 0, moved: false };
  stage.addEventListener('touchstart', (e) => {
    swipeConsumed = false;                       // clear any stale flag
    if (e.target.closest('#tapbar')) return;
    if (!barEligible() || playlist.length === 0) return;
    const t = e.touches[0];
    swipe.active = true; swipe.startX = t.clientX; swipe.lastX = t.clientX;
    swipe.moved = false;
  }, { passive: true });
  stage.addEventListener('touchmove', (e) => {
    if (!swipe.active) return;
    const x = e.touches[0].clientX;
    while (x - swipe.lastX >= swipeStepPx) { stepFrame(+1); swipe.lastX += swipeStepPx; swipe.moved = true; }
    while (x - swipe.lastX <= -swipeStepPx) { stepFrame(-1); swipe.lastX -= swipeStepPx; swipe.moved = true; }
    if (Math.abs(x - swipe.startX) > 8) swipe.moved = true;
    if (swipe.moved) e.preventDefault();         // stop page pan/zoom while swiping
  }, { passive: false });
  function endSwipe() {
    if (swipe.moved) swipeConsumed = true;        // suppress the trailing click
    swipe.active = false;
  }
  stage.addEventListener('touchend', endSwipe);
  stage.addEventListener('touchcancel', endSwipe);
  function tapAction(fn) {
    return (e) => { e.stopPropagation(); if (playlist.length) fn(); resetBarTimer(); };
  }
  tpPlay.addEventListener('click', tapAction(() => {
    if (video.paused) play(); else video.pause();
  }));
  tpPrev.addEventListener('click', tapAction(() => stepFrame(-1)));
  tpNext.addEventListener('click', tapAction(() => stepFrame(+1)));

  // fullscreen mode: CSS full-bleed + (where supported) the Fullscreen API
  function enterFs() {
    document.body.classList.add('fs');
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { try { req.call(el); } catch (e) {} }
    syncFullscreenBtn();
  }
  function exitFs() {
    document.body.classList.remove('fs');
    hideBar();
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex && (document.fullscreenElement || document.webkitFullscreenElement)) {
      try { ex.call(document); } catch (e) {}
    }
    syncFullscreenBtn();
  }
  // Swap the header button's icon and label so it shows what a press will do
  // (expand when windowed, shrink in fullscreen mode). The mode is the CSS
  // full-bleed class, which also covers iPhone where the Fullscreen API is missing.
  function syncFullscreenBtn() {
    const on = document.body.classList.contains('fs');
    const label = t(on ? 'c.exitFullscreen' : 'c.fullscreen');
    fullscreenBtn.classList.toggle('is-fullscreen', on);
    fullscreenBtn.title = label;
    fullscreenBtn.setAttribute('aria-label', label);
  }
  // The header ⛶ (common to every yukmmz.github.io app) enters the same
  // fullscreen mode as the "⛶ 全画面" control. It stays visible even where the
  // Fullscreen API is missing (iPhone): the CSS full-bleed mode works anyway.
  fsBtn.addEventListener('click', enterFs);
  fullscreenBtn.addEventListener('click', () => {
    if (document.body.classList.contains('fs')) exitFs(); else enterFs();
  });
  fsExit.addEventListener('click', exitFs);
  function onFullscreenChange() {
    if (!(document.fullscreenElement || document.webkitFullscreenElement)) {
      document.body.classList.remove('fs');
    }
    syncFullscreenBtn();
  }
  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);

  // keyboard (desktop testing). Esc closes an open settings / QR / changelog /
  // help window first; otherwise it leaves fullscreen mode. ? opens the help.
  document.addEventListener('keydown', (e) => {
    const tag = e.target.tagName;
    const typing = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
    if (e.key === '?' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
      e.preventDefault(); openHelp(); return;
    }
    if (anyModalOpen()) {
      if (e.code === 'Escape') closeModals();   // also from the focused <select>
      return;   // no player shortcuts behind a modal
    }
    if (typing) return;
    if (e.code === 'Space') { e.preventDefault(); playpause.click(); }
    else if (e.code === 'ArrowLeft') stepFrame(-1);
    else if (e.code === 'ArrowRight') stepFrame(+1);
    else if (e.code === 'Escape') exitFs();
    else if (e.key === 'f') enterFs();
  });

  // Text built in JS rather than marked up with data-i18n: rebuild on switch.
  function applyLanguage() {
    langSelect.value = I18N.lang();
    updatePP();
    updateMute();
    updateCollapse();
    if (playlist.length === 0) titleEl.textContent = t('noVideo');
    syncFullscreenBtn();
    // swipe presets show only a number, so label them for hover / screen readers
    document.querySelectorAll('.swp').forEach(b => {
      const label = t('swpPreset', { v: b.dataset.v });
      b.title = label;
      b.setAttribute('aria-label', label);
    });
    buildChangelog();
  }
  I18N.onChange(applyLanguage);
  applyLanguage();

  // register service worker for offline use (ignored when opened via file://)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
